name: mysql-destroy

# Tira las 2 EC2 de MySQL (y su SG/key pair). Solo toca el stack
# mysql-multimaster; el backend serverless y Postgres NO se ven afectados.
# Se pierden los datos de las bases. Manual: confirm debe ser "destroy".
#
# Requisitos: secrets AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, variable AWS_REGION.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Escribe: destroy"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: mysql-multimaster
  cancel-in-progress: false

env:
  TF_DIR: infra/environments/mysql-multimaster
  TF_VAR_region: ${{ vars.AWS_REGION }}

jobs:
  destroy:
    runs-on: ubuntu-latest
    steps:
      - name: Validar confirmacion
        if: ${{ inputs.confirm != 'destroy' }}
        run: |
          echo "::error::Debes escribir 'destroy' en el campo confirm."
          exit 1

      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.5

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Terraform Init
        working-directory: ${{ env.TF_DIR }}
        run: terraform init -input=false

      - name: Terraform Destroy
        working-directory: ${{ env.TF_DIR }}
        run: terraform destroy -auto-approve -input=false
