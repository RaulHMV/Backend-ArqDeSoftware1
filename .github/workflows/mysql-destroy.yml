name: mysql-destroy

# Tira las 2 EC2 de MySQL (y su SG/key pair). Solo toca el stack
# mysql-multimaster; el backend serverless y Postgres NO se ven afectados.
# Se pierden los datos de las bases. Manual: confirm debe ser "destroy".
#
# Requisitos: secrets AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, variable AWS_REGION.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Escribe: destroy"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: mysql-multimaster
  cancel-in-progress: false

env:
  TF_DIR: infra/environments/mysql-multimaster
  TF_VAR_region: ${{ vars.AWS_REGION }}

jobs:
  destroy:
    runs-on: ubuntu-latest
    steps:
      - name: Validar confirmacion
        if: ${{ inputs.confirm != 'destroy' }}
        run: |
          echo "::error::Debes escribir 'destroy' en el campo confirm."
          exit 1

      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.5
          # Sin wrapper: necesitamos la salida limpia de `terraform output`.
          terraform_wrapper: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Terraform Init
        working-directory: ${{ env.TF_DIR }}
        run: terraform init -input=false

      # IDs antes de borrar, para confirmar despues que AWS si las elimino.
      - name: Guardar IDs de las instancias
        id: ids
        working-directory: ${{ env.TF_DIR }}
        run: |
          ids=$(terraform output -json nodes 2>/dev/null | jq -r '[.[].instance_id] | join(" ")') || ids=""
          echo "ids=$ids" >> "$GITHUB_OUTPUT"

      # destroy TERMINA (borra) las EC2 con su disco, y borra SG, reglas y key pair.
      - name: Terraform Destroy
        working-directory: ${{ env.TF_DIR }}
        run: terraform destroy -auto-approve -input=false

      - name: Confirmar que AWS las elimino
        env:
          IDS: ${{ steps.ids.outputs.ids }}
        run: |
          read -ra ids <<< "$IDS"
          {
            echo "### Recursos eliminados (mysql-multimaster)"
            echo
            if (( ${#ids[@]} > 0 )); then
              aws ec2 wait instance-terminated --instance-ids "${ids[@]}"
              echo "| Instancia | Estado |"
              echo "|---|---|"
              aws ec2 describe-instances --instance-ids "${ids[@]}" \
                --query 'Reservations[].Instances[].[InstanceId,State.Name]' --output text \
                | awk '{print "| " $1 " | " $2 " |"}'
            else
              echo "No habia instancias en el state (ya estaba destruido)."
            fi
            echo
            echo "**terminated = borrada** (con su disco); ya no cobra. La consola de AWS la sigue"
            echo "mostrando ~1 h y luego desaparece sola. SG, reglas y key pair tambien se borraron."
          } >> "$GITHUB_STEP_SUMMARY"
