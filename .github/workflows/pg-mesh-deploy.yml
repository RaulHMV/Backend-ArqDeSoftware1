name: pg-mesh-deploy

# Levanta 4 EC2 con PostgreSQL 16: 4 maestros iguales en replicacion logica de
# MALLA COMPLETA (cada nodo suscrito a los otros 3, origin = none). Todos aceptan
# escrituras y si uno se cae los otros 3 siguen; al volver se pone al dia solo.
# Stack independiente (state propio: pg-mesh/). Son 4 EC2: destruir al terminar.
#
# Despliegue MANUAL. En GitHub > Actions > pg-mesh-deploy > Run workflow:
#   - action: plan (solo previsualiza) o apply (crea y configura de verdad).
#   - confirm: para apply, escribe "deploy".
#
# Requisitos (Settings > Secrets and variables > Actions, scope repo):
#   - secrets: AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY  (ya existen)
#   - secret: POSTGRES_PASSWORD (min 12 chars, solo letras, numeros, _ . -)
#   - variable: AWS_REGION  (ya existe)
#   - variable (opcional, recomendada): SSH_PUBLIC_KEY = contenido de tu
#     ~/.ssh/id_ed25519.pub. Con ella entras por SSH a los nodos. Es publica, va en
#     Variables (no en Secrets).

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Que hacer"
        required: true
        default: plan
        type: choice
        options:
          - plan
          - apply
      confirm:
        description: 'Para "apply" escribe: deploy'
        required: false
        default: ""
        type: string
      show_ssh_key:
        description: "Mostrar la llave SSH privada en el resumen del run (solo repo PRIVADO)"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

# Un solo run a la vez sobre este state (deploy y destroy comparten grupo).
concurrency:
  group: pg-mesh
  cancel-in-progress: false

env:
  TF_DIR: infra/environments/pg-mesh
  ANSIBLE_DIR: infra/ansible/pg-mesh
  TF_VAR_region: ${{ vars.AWS_REGION }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Validar confirmacion (solo apply)
        if: ${{ inputs.action == 'apply' && inputs.confirm != 'deploy' }}
        run: |
          echo "::error::Para 'apply' debes escribir 'deploy' en el campo confirm."
          exit 1

      # La llave privada en el resumen la ve cualquiera con acceso de lectura al repo:
      # si es publico, cualquiera podria entrar a las EC2. Falla ANTES de crear nada.
      - name: Validar repo privado (solo si piden mostrar la llave)
        if: ${{ inputs.action == 'apply' && inputs.show_ssh_key }}
        env:
          REPO_PRIVATE: ${{ github.event.repository.private }}
        run: |
          if [[ "$REPO_PRIVATE" != "true" ]]; then
            echo "::error::El repo es publico: no se muestra la llave privada. Usa SSH_PUBLIC_KEY o vuelve el repo privado."
            exit 1
          fi

      # Falla rapido y claro antes de crear nada en AWS.
      # Sin comillas/espacios: el password va dentro del CONNECTION de la suscripcion.
      - name: Validar POSTGRES_PASSWORD (solo apply)
        if: ${{ inputs.action == 'apply' }}
        env:
          PG_PASS: ${{ secrets.POSTGRES_PASSWORD }}
        run: |
          if [[ ! "$PG_PASS" =~ ^[A-Za-z0-9_.-]{12,}$ ]]; then
            echo "::error::POSTGRES_PASSWORD debe existir, tener >=12 caracteres y solo [A-Za-z0-9_.-]."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.5
          # Sin wrapper: necesitamos la salida limpia de `terraform output`.
          terraform_wrapper: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Terraform Init
        working-directory: ${{ env.TF_DIR }}
        run: terraform init -input=false

      - name: Terraform Plan
        working-directory: ${{ env.TF_DIR }}
        run: terraform plan -input=false -out=tfplan

      # Aplica exactamente el plan de arriba (no recalcula).
      - name: Terraform Apply
        if: ${{ inputs.action == 'apply' }}
        working-directory: ${{ env.TF_DIR }}
        run: terraform apply -input=false tfplan

      - name: Generar llave SSH e inventario
        if: ${{ inputs.action == 'apply' }}
        run: |
          KEY="$RUNNER_TEMP/pgmesh_key"
          terraform -chdir="$TF_DIR" output -raw ssh_private_key > "$KEY"
          chmod 600 "$KEY"
          terraform -chdir="$TF_DIR" output -json nodes > "$RUNNER_TEMP/nodes.json"
          python3 infra/ansible/make_inventory.py "$RUNNER_TEMP/nodes.json" "$KEY" pg > "$RUNNER_TEMP/inventory.json"

      - uses: actions/setup-python@v5
        if: ${{ inputs.action == 'apply' }}
        with:
          python-version: "3.12"

      # Versiones FIJAS (las probadas). El runner trae su propio Ansible y
      # colecciones preinstaladas que cambian solas entre imagenes: no se usan.
      - name: Instalar Ansible
        if: ${{ inputs.action == 'apply' }}
        run: |
          python -m venv "$RUNNER_TEMP/ansible-venv"
          "$RUNNER_TEMP/ansible-venv/bin/pip" install --quiet "ansible-core==2.21.4"
          "$RUNNER_TEMP/ansible-venv/bin/ansible-galaxy" collection install \
            "community.postgresql:==5.0.0" -p "$RUNNER_TEMP/collections"
          echo "$RUNNER_TEMP/ansible-venv/bin" >> "$GITHUB_PATH"
          echo "ANSIBLE_COLLECTIONS_PATH=$RUNNER_TEMP/collections" >> "$GITHUB_ENV"

      - name: Configurar PostgreSQL (Ansible)
        if: ${{ inputs.action == 'apply' }}
        working-directory: ${{ env.ANSIBLE_DIR }}
        env:
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          SSH_PUBLIC_KEY: ${{ vars.SSH_PUBLIC_KEY }}
        run: ansible-playbook -i "$RUNNER_TEMP/inventory.json" playbook.yml

      - name: Resumen
        if: ${{ inputs.action == 'apply' }}
        run: |
          {
            echo "### PostgreSQL en malla: 4 maestros"
            echo
            echo "| Maestro | Nodo | AZ | IP publica | IP privada | IDs |"
            echo "|---|---|---|---|---|---|"
            jq -r 'to_entries | sort_by(.value.index)[] | "| \(.value.index + 1) | \(.key) | \(.value.az) | \(.value.public_ip) | \(.value.private_ip) | \(.value.index + 1), \(.value.index + 5), \(.value.index + 9).. |"' "$RUNNER_TEMP/nodes.json"
            echo
            echo "SSH: \`ssh ubuntu@<IP publica>\` y luego \`sudo -u postgres psql demo\`."
            echo "Ver la malla: \`\\dRs\` (3 suscripciones por nodo) y \`SELECT * FROM mensajes ORDER BY id;\`"
            echo "Recuerda correr **pg-mesh-destroy** cuando termines: son 4 EC2 facturando."
          } >> "$GITHUB_STEP_SUMMARY"

      # Opcional (input show_ssh_key, solo repo privado): bloque para copiar y pegar.
      - name: Mostrar llave SSH en el resumen
        if: ${{ inputs.action == 'apply' && inputs.show_ssh_key }}
        run: |
          {
            echo "### Llave SSH (copia TODO el bloque y pegalo en tu terminal)"
            echo
            echo '```bash'
            echo "cat > ~/pgmesh_key <<'EOF'"
            cat "$RUNNER_TEMP/pgmesh_key"
            echo "EOF"
            echo "chmod 600 ~/pgmesh_key"
            echo '```'
            echo
            echo "Despues conectate (usuario \`ubuntu\`, sin password: AWS solo acepta llave):"
            echo
            jq -r 'to_entries | sort_by(.value.index)[] | "- \(.key): `ssh -i ~/pgmesh_key ubuntu@\(.value.public_ip)`"' "$RUNNER_TEMP/nodes.json"
            echo
            echo "Ya dentro: \`sudo -u postgres psql demo\` (no pide password; el password es el secret POSTGRES_PASSWORD, solo para conexiones por red)."
            echo
            echo "> Esta llave es de una demo: corre **pg-mesh-destroy** al terminar."
          } >> "$GITHUB_STEP_SUMMARY"
