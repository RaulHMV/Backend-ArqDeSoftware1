---
db_name: demo
mysql_conf_dir: /etc/mysql/mysql.conf.d
mysql_socket: /var/run/mysqld/mysqld.sock

# "El otro" nodo: el unico host del grupo que no soy yo.
peer: "{{ (groups['mysql'] | difference([inventory_hostname])) | first }}"
peer_ip: "{{ hostvars[peer].private_ip }}"

# Tu llave publica para entrar por SSH a mano (variable SSH_PUBLIC_KEY de GitHub).
# Opcional: si esta vacia solo entra la llave que genera Terraform (la del runner).
extra_ssh_key: "{{ lookup('env', 'SSH_PUBLIC_KEY') }}"

# Password del usuario de replicacion: el workflow le pasa el MISMO secret
# POSTGRES_PASSWORD que usa el stack de Postgres. Nunca va en el repo.
repl_password: "{{ lookup('env', 'MYSQL_PASSWORD') }}"
