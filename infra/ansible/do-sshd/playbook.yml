---
# Hardening de SSH + PAM en el droplet SSHD-Conexion (Rocky Linux 9, SELinux enforcing).
#
# Resultado:
#  - Solo entra {{ admin_user }}, con su llave RSA 4096 Y el codigo de Google
#    Authenticator. root no entra; el password de Unix no sirve para entrar por SSH.
#  - SSH en el puerto {{ ssh_port }} (el 22 queda cerrado). El firewall de DigitalOcean
#    (Terraform) solo deja llegar a ese puerto desde tu IP.
#  - {{ admin_user }} es de MINIMO PRIVILEGIO: solo en su propio grupo, sin sudo y sin
#    password propio. Para ser root: su - con el password de root (secret ROOT_PASSWORD);
#    y solo {{ admin_user }} puede usar su.
#  - La llave autorizada y el secreto OTP viven fuera de su home, en carpetas de root.
#  - Banner de acceso restringido antes de autenticarse.
#  - sshd y PAM sin las opciones que no se usan.
#
# Requiere en el entorno: ADMIN_USER, ROOT_PASSWORD, TOTP_SECRET, SSH_KEY_FILE,
# SSH_PUBLIC_KEY_FILE, SSH_PORT, DROPLET_IP, CONNECT_AS (root|admin) y
# SSH_CONNECT_PORT. Lo arma el workflow.
# Idempotente: se puede volver a correr ya endurecido (entra con llave + codigo y se
# hace root con su -).
#
# ORDEN IMPORTANTE: sshd se reinicia al FINAL (handler). Antes de eso ya deben estar
# SELinux y firewalld con el puerto nuevo y la llave del servidor en 4096: si sshd no
# arranca, nadie puede entrar. La sesion de Ansible ya abierta sobrevive al reinicio.

- name: Hardening de SSH y PAM
  hosts: sshd
  become: true
  gather_facts: false

  pre_tasks:
    - name: Esperar SSH
      ansible.builtin.wait_for_connection:
        timeout: 300

    # cloud-init todavia puede estar instalando paquetes en el primer boot
    - name: Esperar a que cloud-init termine
      ansible.builtin.command: cloud-init status --wait
      register: cloud_init
      changed_when: false
      failed_when: cloud_init.rc not in [0, 2]

    - name: Validar parametros
      ansible.builtin.assert:
        that:
          - admin_user is match('^[a-z_][a-z0-9_-]{0,31}$')
          - admin_user != 'root'
          - root_password | length >= 12
          - totp_secret is match('^[A-Z2-7]{16,}$')
          - admin_pubkey is match('^ssh-rsa ')
          - "'2' not in (ssh_port | string) and 1024 <= ssh_port | int <= 65535"
        fail_msg: >-
          Revisa: usuario en minusculas (no root), ROOT_PASSWORD de 12+ caracteres,
          TOTP_SECRET en base32 (A-Z y 2-7, 16+ caracteres), llave RSA y puerto
          entre 1024 y 65535 sin ningun 2.
      no_log: true

  tasks:
    # ------------------------------------------------------------ Swap
    # Con 1 GB de RAM, dnf cargando EPEL se queda sin memoria y el sistema lo mata
    # (rc -9: paso en el primer deploy). La swap va ANTES de cualquier dnf.
    - name: Ver si ya hay swap
      ansible.builtin.command: swapon --show=NAME --noheadings
      register: swap_actual
      changed_when: false

    # dd y no fallocate: es lo que documenta RHEL y funciona tambien en XFS.
    # SELinux: swapon corre como fsadm_t, que puede usar el archivo sin re-etiquetarlo.
    - name: Crear swap de {{ swap_mb }} MB en /swapfile
      ansible.builtin.shell: |
        set -e
        dd if=/dev/zero of=/swapfile bs=1M count={{ swap_mb }} status=none
        chmod 600 /swapfile
        mkswap /swapfile
        swapon /swapfile
      when: "'/swapfile' not in swap_actual.stdout"

    - name: Swap permanente (sobrevive reinicios)
      ansible.builtin.lineinfile:
        path: /etc/fstab
        line: "/swapfile none swap defaults 0 0"

    # 10 = usar swap solo cuando de verdad falte RAM.
    - name: Swap solo como respaldo (swappiness 10)
      ansible.builtin.copy:
        dest: /etc/sysctl.d/90-swap.conf
        content: "vm.swappiness = 10\n"
        owner: root
        group: root
        mode: "0644"
      register: swappiness

    - name: Aplicar swappiness
      ansible.builtin.command: sysctl -p /etc/sysctl.d/90-swap.conf
      when: swappiness.changed

    # ------------------------------------------------------------ Paquetes
    # El modulo PAM de Google Authenticator viene de EPEL.
    # python3-libselinux: Ansible lo necesita para escribir archivos con SELinux activo.
    # policycoreutils-python-utils: trae semanage (puerto de SSH en SELinux).
    - name: EPEL y utilerias de SELinux
      ansible.builtin.dnf:
        name:
          - epel-release
          - python3-libselinux
          - policycoreutils-python-utils
        state: present

    # openssh a la ultima del repo: parches de seguridad y la version (9.9) para la
    # que esta escrito el sshd_config.
    - name: OpenSSH actualizado y modulo PAM de Google Authenticator
      ansible.builtin.dnf:
        name:
          - openssh-server
          - openssh
          - google-authenticator
        state: latest
        update_cache: true
      notify: Reiniciar sshd

    # ------------------------------------------------------------ SELinux
    - name: Estado de SELinux
      ansible.builtin.command: getenforce
      register: selinux
      changed_when: false

    # Todo esta pensado para enforcing (puerto y carpeta OTP etiquetados).
    - name: SELinux en enforcing (ahora y al reiniciar)
      when: selinux.stdout == 'Permissive'
      block:
        - name: Activar enforcing ahora
          ansible.builtin.command: setenforce 1
          changed_when: true

        - name: Dejar enforcing permanente
          ansible.builtin.lineinfile:
            path: /etc/selinux/config
            regexp: '^SELINUX='
            line: SELINUX=enforcing

    - name: Aviso si SELinux esta apagado
      ansible.builtin.debug:
        msg: >-
          SELinux esta Disabled en esta imagen: el hardening funciona igual, pero para
          activarlo hace falta reetiquetar el disco y reiniciar (no se hace solo).
      when: selinux.stdout == 'Disabled'

    # Sin esto sshd NO puede abrir el puerto {{ ssh_port }} con SELinux activo.
    - name: SELinux permite a sshd usar el puerto {{ ssh_port }}
      ansible.builtin.shell: |
        if semanage port -l | grep -Eq "^ssh_port_t\s+tcp\s+(.*[ ,])?{{ ssh_port }}(,|$)"; then
          echo sin_cambio
        else
          semanage port -a -t ssh_port_t -p tcp {{ ssh_port }} 2>/dev/null \
            || semanage port -m -t ssh_port_t -p tcp {{ ssh_port }}
        fi
      register: seport
      changed_when: "'sin_cambio' not in seport.stdout"
      when: selinux.stdout != 'Disabled'

    # ------------------------------------------------------------ firewalld
    # La imagen de DO normalmente no lo trae activo (filtra el firewall de DO), pero si
    # esta activo: abre {{ ssh_port }} y cierra el 22. Las sesiones abiertas no se cortan.
    - name: Ver si firewalld esta activo
      ansible.builtin.command: systemctl is-active firewalld
      register: firewalld
      changed_when: false
      failed_when: false

    - name: firewalld solo con el puerto {{ ssh_port }}
      ansible.builtin.shell: |
        set -e
        cambio=no
        if ! firewall-cmd --permanent --query-port={{ ssh_port }}/tcp >/dev/null; then
          firewall-cmd --permanent --add-port={{ ssh_port }}/tcp >/dev/null; cambio=si
        fi
        if firewall-cmd --permanent --query-service=ssh >/dev/null; then
          firewall-cmd --permanent --remove-service=ssh >/dev/null; cambio=si
        fi
        if [ "$cambio" = si ]; then firewall-cmd --reload >/dev/null; fi
        echo "$cambio"
      register: fw
      changed_when: fw.stdout == 'si'
      when: firewalld.stdout == 'active'

    # ------------------------------------------------------------ Usuario y root
    # MINIMO PRIVILEGIO: solo su propio grupo (groups "" lo saca de wheel = sin sudo) y
    # sin password propio ("!"): entra con llave + codigo y no lo necesita para nada mas.
    - name: Usuario {{ admin_user }} de minimo privilegio (solo su grupo, sin sudo)
      ansible.builtin.user:
        name: "{{ admin_user }}"
        shell: /bin/bash
        groups: ""
        append: false
        password: "!"
        update_password: always

    # su - pide ESTE password (secret ROOT_PASSWORD). root sigue sin entrar por SSH.
    # Salt fijo: mismo hash en cada corrida, sin "changed" falso.
    - name: Password de root (para su -)
      ansible.builtin.user:
        name: root
        password: "{{ root_password | password_hash('sha512', 'root-sshd' | hash('sha256') | truncate(16, true, '', 0)) }}"
        update_password: always
      no_log: true

    # Solo {{ admin_user }} puede usar su: pam_wheel con SU grupo (no wheel). pam_wheel
    # cuenta el grupo primario, asi el usuario sigue solo en su grupo. root no se afecta
    # (pam_rootok va antes).
    - name: Solo {{ admin_user }} puede usar su
      ansible.builtin.lineinfile:
        path: /etc/pam.d/su
        regexp: '^#?\s*auth\s+required\s+pam_wheel\.so'
        line: "auth\t\trequired\tpam_wheel.so use_uid group={{ admin_user }}"
        insertafter: '^auth\s+sufficient\s+pam_rootok\.so'

    # La llave NO va en ~/.ssh/authorized_keys (ahi el usuario podria agregar otras):
    # va en {{ keys_dir }}/<usuario>, de root. sshd la lee COMO el usuario, por eso 0644
    # (puede leerla, no cambiarla). SELinux: etc_t, que sshd puede leer.
    - name: Carpeta de llaves autorizadas (de root)
      ansible.builtin.file:
        path: "{{ keys_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0755"

    # Exclusivo: solo tu llave RSA 4096, cualquier otra se borra.
    - name: Solo tu llave publica puede entrar ({{ keys_dir }}/{{ admin_user }})
      ansible.builtin.copy:
        dest: "{{ keys_dir }}/{{ admin_user }}"
        content: "{{ admin_pubkey | trim }}\n"
        owner: root
        group: root
        mode: "0644"

    # ---------------------------------------------------------- OTP (Google Authenticator)
    # Ruta propia en vez de ~/.google_authenticator. Todo de root: el usuario entra normal
    # (llave + codigo) pero no puede leer su secreto; PAM lo abre como root (user=root).
    # SELinux: var_auth_t (como /var/lib/google-authenticator en la politica de Rocky), el
    # tipo donde sshd puede reescribir el archivo en cada login. La regla es permanente.
    - name: SELinux etiqueta {{ otp_dir }} como var_auth_t (permanente)
      ansible.builtin.shell: |
        if semanage fcontext -l -C | grep -q "^{{ otp_dir }}(/\.\*)?\s.*var_auth_t"; then
          echo sin_cambio
        else
          semanage fcontext -a -t var_auth_t "{{ otp_dir }}(/.*)?" 2>/dev/null \
            || semanage fcontext -m -t var_auth_t "{{ otp_dir }}(/.*)?"
        fi
      register: otp_fcontext
      changed_when: "'sin_cambio' not in otp_fcontext.stdout"
      when: selinux.stdout != 'Disabled'

    - name: Carpeta de secretos OTP (solo root)
      ansible.builtin.file:
        path: "{{ otp_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0700"
        setype: var_auth_t

    # El modulo PAM reescribe este archivo en cada login (guarda los codigos usados para
    # DISALLOW_REUSE y RATE_LIMIT): solo se escribe si falta o si cambio el secreto.
    - name: Leer secreto OTP actual
      ansible.builtin.slurp:
        src: "{{ otp_file }}"
      register: ga_actual
      failed_when: false
      no_log: true

    - name: Secreto OTP de {{ admin_user }} ({{ otp_file }})
      ansible.builtin.copy:
        dest: "{{ otp_file }}"
        content: |
          {{ totp_secret }}
          " RATE_LIMIT 3 30
          " WINDOW_SIZE 3
          " DISALLOW_REUSE
          " TOTP_AUTH
        owner: root
        group: root
        mode: "0400"
        setype: var_auth_t
      when: >-
        ga_actual.content is not defined
        or (ga_actual.content | b64decode).splitlines()[0] != totp_secret
      no_log: true

    # ------------------------------------------------------------ sudo
    # Nadie tiene sudo ({{ admin_user }} no esta en wheel); si algun dia se da, ya queda
    # con bitacora y limites.
    - name: Endurecer sudo
      ansible.builtin.copy:
        dest: /etc/sudoers.d/90-hardening
        content: |
          # Gestionado por Ansible (infra/ansible/do-sshd). No editar a mano.
          Defaults use_pty
          Defaults logfile="/var/log/sudo.log"
          Defaults passwd_tries=3
          Defaults timestamp_timeout=5
        owner: root
        group: root
        mode: "0440"
        validate: visudo -cf %s

    # ------------------------------------------------------------ Banner
    - name: Banner antes de autenticarse (SSH) y en la consola
      ansible.builtin.copy:
        dest: "{{ item }}"
        content: "{{ banner_text }}"
        owner: root
        group: root
        mode: "0644"
      loop:
        - /etc/issue.net
        - /etc/issue

    # ------------------------------------------------------------ PAM
    - name: Solo {{ admin_user }} pasa el control de acceso de PAM
      ansible.builtin.copy:
        dest: /etc/security/access-sshd.conf
        content: |
          # Gestionado por Ansible (infra/ansible/do-sshd). No editar a mano.
          + : {{ admin_user }} : ALL
          - : ALL : ALL
        owner: root
        group: root
        mode: "0644"

    - name: PAM de sshd (llave + codigo TOTP, sin modulos que no se usan)
      ansible.builtin.template:
        src: pam_sshd.j2
        dest: /etc/pam.d/sshd
        owner: root
        group: root
        mode: "0644"
        backup: true

    # ------------------------------------------------------------ sshd
    # Rocky crea la llave RSA del servidor de 3072 bits; con RequiredRSASize 4096 sshd
    # ni siquiera arrancaria con ella. Se regenera a 4096 (solo si hace falta).
    - name: Tamano de la llave RSA del servidor
      ansible.builtin.command: ssh-keygen -l -f /etc/ssh/ssh_host_rsa_key.pub
      register: hostkey_rsa
      changed_when: false
      failed_when: false

    - name: Llave RSA del servidor de 4096 bits
      ansible.builtin.shell: |
        set -e
        rm -f /etc/ssh/ssh_host_rsa_key /etc/ssh/ssh_host_rsa_key.pub
        ssh-keygen -q -t rsa -b 4096 -N "" -C "" -f /etc/ssh/ssh_host_rsa_key
        chgrp ssh_keys /etc/ssh/ssh_host_rsa_key
        chmod 0640 /etc/ssh/ssh_host_rsa_key
        if selinuxenabled; then restorecon /etc/ssh/ssh_host_rsa_key /etc/ssh/ssh_host_rsa_key.pub; fi
      when: hostkey_rsa.rc != 0 or (hostkey_rsa.stdout.split()[0] | int) < 4096
      notify: Reiniciar sshd

    # root ya no podra entrar (PermitRootLogin no + pam_access); ademas se le quita la
    # llave que DigitalOcean le puso al crear el droplet.
    - name: Quitar la llave de root
      ansible.builtin.copy:
        dest: /root/.ssh/authorized_keys
        content: ""
        owner: root
        group: root
        mode: "0600"

    # validate: si la config tiene un error, no se escribe y sshd sigue como estaba.
    - name: sshd_config endurecido
      ansible.builtin.template:
        src: sshd_config.j2
        dest: /etc/ssh/sshd_config
        owner: root
        group: root
        mode: "0600"
        backup: true
        validate: /usr/sbin/sshd -t -f %s
      notify: Reiniciar sshd

    # sshd ya usa la config nueva (llave en {{ keys_dir }}). La sesion de Ansible sigue
    # abierta; recien ahora se quitan las rutas viejas (antes, un reconect fallaria).
    - name: Aplicar la config de sshd ahora
      ansible.builtin.meta: flush_handlers

    - name: Quitar la llave y el secreto OTP de las rutas viejas (home del usuario)
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - "/home/{{ admin_user }}/.ssh/authorized_keys"
        - "/home/{{ admin_user }}/.ssh/.google_authenticator"

  handlers:
    - name: Reiniciar sshd
      ansible.builtin.service:
        name: sshd
        state: restarted
