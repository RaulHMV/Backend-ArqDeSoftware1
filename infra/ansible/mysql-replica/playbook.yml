---
# MySQL 8.0 maestro-esclavo configurado A PROPOSITO "como tutorial" (MAL):
#   - replicacion por posicion de binlog, sin GTID
#   - el esclavo ACEPTA escrituras (sin read_only): cualquiera puede escribir ahi
#   - sin triggers, sin vigilante, sin nada de proteccion
# Lo unico ya resuelto: IDs impares en el maestro y pares en el esclavo.
# Esto simula la replica de produccion que "ya estaba mal hecha". Para arreglarla
# sin borrar ni reclonar: rescate.yml (workflow mysql-replica-rescate).
#
# Requiere en el entorno MYSQL_PASSWORD (el workflow le pasa POSTGRES_PASSWORD).
# Tags: "os" = sistema operativo; "db" = todo lo que se hace dentro de MySQL.

- name: Preparar ambos nodos
  hosts: mysql
  become: true
  gather_facts: false

  pre_tasks:
    - name: Esperar SSH
      ansible.builtin.wait_for_connection:
        timeout: 300

    - name: Esperar a que cloud-init termine
      ansible.builtin.command: cloud-init status --wait
      register: cloud_init
      changed_when: false
      failed_when: cloud_init.rc not in [0, 2]
      tags: os

  tasks:
    - name: Validar que llego el password
      ansible.builtin.assert:
        that: repl_password | length > 0
        fail_msg: "Falta el password: revisa el secret POSTGRES_PASSWORD (el workflow lo pasa como MYSQL_PASSWORD)"
      no_log: true
      tags: db

    - name: Validar formato de SSH_PUBLIC_KEY (si se dio)
      ansible.builtin.assert:
        that: extra_ssh_key is match('^ssh-(ed25519|rsa) ')
        fail_msg: "SSH_PUBLIC_KEY debe ser una llave publica (ssh-ed25519 ... o ssh-rsa ...)"
      when: extra_ssh_key | length > 0
      tags: os

    - name: Autorizar tu llave SSH para el usuario ubuntu
      ansible.builtin.lineinfile:
        path: "/home/{{ ansible_user }}/.ssh/authorized_keys"
        line: "{{ extra_ssh_key }}"
      when: extra_ssh_key | length > 0
      tags: os

    - name: Instalar MySQL 8.0 y dependencias
      ansible.builtin.apt:
        name:
          - mysql-server
          - python3-pymysql
        state: present
        update_cache: true
        cache_valid_time: 3600
        lock_timeout: 600
      tags: os

    # Ubuntu trae bind-address = 127.0.0.1; el SG limita 3306 a los 2 nodos.
    - name: Escuchar en todas las interfaces
      ansible.builtin.lineinfile:
        path: "{{ mysql_conf_dir }}/mysqld.cnf"
        regexp: '^bind-address\s*='
        line: "bind-address = 0.0.0.0"
      notify: Restart mysql
      tags: os

    - name: Configuracion de replicacion "de tutorial"
      ansible.builtin.copy:
        dest: "{{ mysql_conf_dir }}/replica.cnf"
        owner: root
        group: root
        mode: "0644"
        content: |
          [mysqld]
          server_id = {{ node_index | int + 1 }}
          # A PROPOSITO: sin read_only en el esclavo. Lo demas, defaults de MySQL 8
          # (binlog ON, formato ROW, imagen FULL): justo lo que permite el rescate.
          # IDs impar/par (lo unico resuelto): maestro 1,3,5..; esclavo 2,4,6..
          auto_increment_increment = 2
          auto_increment_offset = {{ node_index | int + 1 }}
          {% if usar_gtid | bool %}
          gtid_mode = ON
          enforce_gtid_consistency = ON
          {% endif %}
      notify: Restart mysql
      tags: os

    - name: Aplicar cambios ahora
      ansible.builtin.meta: flush_handlers
      tags: os

    - name: MySQL arriba y habilitado
      ansible.builtin.service:
        name: mysql
        state: started
        enabled: true
      tags: os

  handlers:
    - name: Restart mysql
      ansible.builtin.service:
        name: mysql
        state: restarted

- name: Maestro - usuario de replicacion y posicion de arranque
  hosts: mysql
  become: true
  gather_facts: false
  tags: db
  module_defaults:
    group/ansible.mysql.all:
      login_unix_socket: "{{ mysql_socket }}"
      login_user: root

  tasks:
    - name: Usuario de replicacion para el esclavo
      ansible.mysql.mysql_query:
        query:
          - CREATE USER IF NOT EXISTS 'replicator'@%(ip)s IDENTIFIED BY %(pw)s
          - ALTER USER 'replicator'@%(ip)s IDENTIFIED BY %(pw)s
          - GRANT REPLICATION SLAVE ON *.* TO 'replicator'@%(ip)s
        named_args:
          ip: "{{ replica_client_host }}"
          pw: "{{ repl_password }}"
      when: is_master | bool
      no_log: true

    # Como en un tutorial: el esclavo arranca desde la posicion ACTUAL del maestro.
    - name: Posicion actual del binlog del maestro
      ansible.mysql.mysql_query:
        query: SHOW MASTER STATUS
      register: master_status
      changed_when: false
      when: is_master | bool

- name: Esclavo - conectarlo al maestro
  hosts: mysql
  become: true
  gather_facts: false
  tags: db
  module_defaults:
    group/ansible.mysql.all:
      login_unix_socket: "{{ mysql_socket }}"
      login_user: root

  tasks:
    - name: Ver si la replica ya esta configurada
      ansible.mysql.mysql_query:
        query: SELECT COUNT(*) AS n FROM performance_schema.replication_connection_configuration WHERE CHANNEL_NAME = ''
      register: rep_cfg
      changed_when: false
      when: not (is_master | bool)

    - name: Configurar y arrancar la replica (por posicion, sin GTID)
      ansible.mysql.mysql_query:
        query:
          - >-
            CHANGE REPLICATION SOURCE TO
            SOURCE_HOST = %(host)s, SOURCE_PORT = 3306,
            SOURCE_USER = 'replicator', SOURCE_PASSWORD = %(pw)s,
            SOURCE_LOG_FILE = %(file)s, SOURCE_LOG_POS = %(pos)s, SOURCE_SSL = 1
          - START REPLICA
        named_args:
          host: "{{ master_ip }}"
          pw: "{{ repl_password }}"
          file: "{{ hostvars[master_host].master_status.query_result[0][0].File }}"
          pos: "{{ hostvars[master_host].master_status.query_result[0][0].Position | int }}"
      when: not (is_master | bool) and rep_cfg.query_result[0][0].n | int == 0
      no_log: true

    - name: Esperar a que la replica corra
      ansible.mysql.mysql_query:
        query: SELECT SERVICE_STATE AS s FROM performance_schema.replication_applier_status WHERE CHANNEL_NAME = ''
      register: rep_estado
      until: rep_estado.query_result[0][0].s == 'ON'
      retries: 20
      delay: 3
      changed_when: false
      when: not (is_master | bool)

- name: Maestro - base de demo con datos de "produccion" (llega al esclavo por replica)
  hosts: mysql
  become: true
  gather_facts: false
  tags: db
  module_defaults:
    group/ansible.mysql.all:
      login_unix_socket: "{{ mysql_socket }}"
      login_user: root

  tasks:
    - name: Tabla clientes
      ansible.mysql.mysql_query:
        query:
          - CREATE DATABASE IF NOT EXISTS {{ db_name }}
          - >-
            CREATE TABLE IF NOT EXISTS {{ db_name }}.clientes (
              id             BIGINT UNSIGNED NOT NULL AUTO_INCREMENT PRIMARY KEY,
              email          VARCHAR(120)    NOT NULL,
              nombre         VARCHAR(120)    NOT NULL,
              saldo          DECIMAL(12,2)   NOT NULL DEFAULT 0,
              notas          TEXT            NULL,
              actualizado_en TIMESTAMP(6)    NOT NULL DEFAULT CURRENT_TIMESTAMP(6) ON UPDATE CURRENT_TIMESTAMP(6),
              UNIQUE KEY uq_email (email)
            )
      when: is_master | bool

    - name: Cargar clientes de "produccion" (solo si la tabla esta vacia)
      ansible.mysql.mysql_query:
        session_vars:
          cte_max_recursion_depth: 10000000   # default 1000: con demo_filas > 1000 fallaria
        query: >-
          INSERT INTO {{ db_name }}.clientes (email, nombre, saldo)
          SELECT CONCAT('cliente', n, '@demo.com'), CONCAT('Cliente ', n), n * 10
            FROM (WITH RECURSIVE s(n) AS (SELECT 1 UNION ALL SELECT n + 1 FROM s WHERE n < {{ demo_filas | int }})
                  SELECT n FROM s) t
           WHERE NOT EXISTS (SELECT 1 FROM {{ db_name }}.clientes)
      when: is_master | bool
